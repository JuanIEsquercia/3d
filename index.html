<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ScanArch Studio - Planos inmobiliarios 2D y 3D</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Konva: motor del editor 2D -->
  <script src="https://unpkg.com/konva@9.3.18/konva.min.js"></script>

  <!-- Three.js, Controls & Exporters -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

  <!-- PDF.js para lectura de planos en PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

  <!-- DXF Parser para lectura de planos CAD -->
  <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Alto real de pantalla en celulares (evita que la barra del navegador tape las pestañas) */
    @supports (height: 100dvh) {
      html, body { height: 100dvh; }
    }

    input, select { user-select: text; -webkit-user-select: text; }

    .glass-panel {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Barras con desplazamiento táctil propio */
    .scroll-x { overflow-x: auto; touch-action: pan-x; scrollbar-width: none; }
    .scroll-x::-webkit-scrollbar { display: none; }
    .scroll-y { overflow-y: auto; touch-action: pan-y; }

    .reticle-ring {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.4; }
    }
  </style>
</head>
<body class="flex flex-col h-full w-full">

  <!-- BARRA SUPERIOR / HEADER -->
  <header class="h-14 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-3 flex items-center justify-between z-40 flex-shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 flex-shrink-0">
        <i data-lucide="layers" class="w-5 h-5"></i>
      </div>
      <div class="min-w-0">
        <h1 class="text-sm font-bold tracking-wide text-white leading-tight truncate">ScanArch Studio</h1>
        <p class="text-[10px] text-slate-400 font-mono truncate">PLANOS 2D &middot; MODELO 3D</p>
      </div>
    </div>

    <div class="flex items-center gap-3 text-xs font-mono">
      <div class="flex flex-col items-end">
        <span id="metric-area-label" class="text-slate-400 text-[10px]">SUPERFICIE</span>
        <span id="metric-area-top" class="text-emerald-400 font-bold">0,00 m²</span>
      </div>

      <!-- Menú principal: proyecto, mensura y exportaciones -->
      <div class="relative">
        <button id="btn-menu" class="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs shadow-lg active:scale-95">
          <i data-lucide="menu" class="w-4 h-4"></i>
          <span>Menú</span>
        </button>

        <div id="main-menu" class="absolute right-0 top-full mt-1 w-60 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl hidden z-50 py-1 text-xs text-slate-200 font-sans">
          <div class="px-3 pt-2 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Proyecto</div>
          <label class="w-full px-3 py-2.5 hover:bg-slate-800 flex items-center gap-2 cursor-pointer">
            <i data-lucide="upload" class="w-4 h-4 text-sky-400"></i> Importar mensura (imagen, PDF, DXF)
            <input type="file" id="input-plan-file" accept="image/*,.pdf,.dxf" class="hidden">
          </label>
          <label class="w-full px-3 py-2.5 hover:bg-slate-800 flex items-center gap-2 cursor-pointer">
            <i data-lucide="folder-open" class="w-4 h-4 text-amber-400"></i> Abrir proyecto (.json)
            <input type="file" id="input-project-file" accept=".json,application/json" class="hidden">
          </label>
          <button id="btn-save-project" class="w-full px-3 py-2.5 text-left hover:bg-slate-800 flex items-center gap-2">
            <i data-lucide="save" class="w-4 h-4 text-emerald-400"></i> Guardar proyecto (.json)
          </button>
          <button id="btn-new-project" class="w-full px-3 py-2.5 text-left hover:bg-slate-800 flex items-center gap-2">
            <i data-lucide="file-plus" class="w-4 h-4 text-rose-400"></i> Proyecto nuevo
          </button>

          <div class="px-3 pt-2 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider border-t border-slate-800 mt-1">Exportar</div>
          <button id="btn-export-brochure" class="w-full px-3 py-2.5 text-left hover:bg-slate-800 flex items-center gap-2">
            <i data-lucide="layout-template" class="w-4 h-4 text-emerald-400"></i> Ficha comercial / Folleto (.PNG)
          </button>
          <button id="btn-export-png" class="w-full px-3 py-2.5 text-left hover:bg-slate-800 flex items-center gap-2">
            <i data-lucide="image" class="w-4 h-4 text-rose-400"></i> Imagen plano 2D (.PNG)
          </button>
          <button id="btn-export-dxf" class="w-full px-3 py-2.5 text-left hover:bg-slate-800 flex items-center gap-2">
            <i data-lucide="file-text" class="w-4 h-4 text-sky-400"></i> Plano CAD (.DXF)
          </button>
          <button id="btn-export-glb" class="w-full px-3 py-2.5 text-left hover:bg-slate-800 flex items-center gap-2">
            <i data-lucide="box" class="w-4 h-4 text-purple-400"></i> Modelo 3D (.GLB)
          </button>
          <button id="btn-export-obj" class="w-full px-3 py-2.5 text-left hover:bg-slate-800 flex items-center gap-2">
            <i data-lucide="box" class="w-4 h-4 text-emerald-400"></i> Modelo 3D (.OBJ)
          </button>
          <button id="btn-export-ply" class="w-full px-3 py-2.5 text-left hover:bg-slate-800 flex items-center gap-2">
            <i data-lucide="cloud" class="w-4 h-4 text-amber-400"></i> Nube de puntos (.PLY)
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DE PANTALLAS -->
  <main class="relative flex-1 w-full overflow-hidden">

    <!-- VISTA: EDITOR DE PLANO 2D -->
    <div id="view-cad" class="absolute inset-0 flex flex-col bg-slate-900">
      <!-- Herramientas -->
      <div class="scroll-x bg-slate-900 border-b border-slate-800 flex-shrink-0">
        <div class="flex items-stretch gap-0.5 p-1.5 min-w-full w-max text-[10px] font-medium">
          <button data-tool="select" class="flex-1 min-w-[50px] px-1 py-1.5 rounded-lg text-slate-300 flex flex-col items-center gap-0.5 whitespace-nowrap">
            <i data-lucide="mouse-pointer" class="w-4 h-4"></i><span>Seleccionar</span>
          </button>
          <button data-tool="wall" class="flex-1 min-w-[50px] px-1 py-1.5 rounded-lg text-slate-300 flex flex-col items-center gap-0.5 whitespace-nowrap">
            <i data-lucide="pencil-ruler" class="w-4 h-4"></i><span>Muro</span>
          </button>
          <button data-tool="room" class="flex-1 min-w-[50px] px-1 py-1.5 rounded-lg text-slate-300 flex flex-col items-center gap-0.5 whitespace-nowrap">
            <i data-lucide="square" class="w-4 h-4"></i><span>Ambiente</span>
          </button>
          <button data-tool="door" class="flex-1 min-w-[50px] px-1 py-1.5 rounded-lg text-slate-300 flex flex-col items-center gap-0.5 whitespace-nowrap">
            <i data-lucide="door-open" class="w-4 h-4"></i><span>Puerta</span>
          </button>
          <button data-tool="window" class="flex-1 min-w-[50px] px-1 py-1.5 rounded-lg text-slate-300 flex flex-col items-center gap-0.5 whitespace-nowrap">
            <i data-lucide="app-window" class="w-4 h-4"></i><span>Ventana</span>
          </button>
          <button data-tool="object" class="flex-1 min-w-[50px] px-1 py-1.5 rounded-lg text-slate-300 flex flex-col items-center gap-0.5 whitespace-nowrap">
            <i data-lucide="sofa" class="w-4 h-4"></i><span>Objeto</span>
          </button>
          <button data-tool="lote" class="flex-1 min-w-[50px] px-1 py-1.5 rounded-lg text-slate-300 flex flex-col items-center gap-0.5 whitespace-nowrap">
            <i data-lucide="land-plot" class="w-4 h-4"></i><span>Lote</span>
          </button>
          <button data-tool="calle" class="flex-1 min-w-[50px] px-1 py-1.5 rounded-lg text-slate-300 flex flex-col items-center gap-0.5 whitespace-nowrap">
            <i data-lucide="route" class="w-4 h-4"></i><span>Calle</span>
          </button>
          <button data-tool="calibrate" class="flex-1 min-w-[50px] px-1 py-1.5 rounded-lg text-slate-300 flex flex-col items-center gap-0.5 whitespace-nowrap">
            <i data-lucide="ruler" class="w-4 h-4"></i><span>Calibrar</span>
          </button>
          <button data-tool="detect" class="flex-1 min-w-[50px] px-1 py-1.5 rounded-lg text-slate-300 flex flex-col items-center gap-0.5 whitespace-nowrap">
            <i data-lucide="scan-search" class="w-4 h-4"></i><span>Detectar</span>
          </button>
        </div>
      </div>

      <!-- Ayuda de la herramienta activa -->
      <div class="px-3 py-1.5 bg-slate-950/80 border-b border-slate-800 flex items-center justify-between gap-2 text-[11px] text-slate-300 flex-shrink-0">
        <span id="cad-hint" class="leading-snug"></span>
        <button id="btn-finish-wall" class="hidden px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 font-bold whitespace-nowrap">Terminar muro</button>
      </div>

      <!-- Lienzo Konva -->
      <div class="relative flex-1 w-full overflow-hidden bg-white">
        <div id="cad-stage" class="absolute inset-0" style="touch-action: none;"></div>

        <!-- Acciones siempre a mano -->
        <div class="absolute top-2 right-2 flex flex-col gap-2 z-20">
          <button id="btn-undo" title="Deshacer" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-amber-300 active:scale-90 disabled:opacity-40">
            <i data-lucide="undo-2" class="w-5 h-5"></i>
          </button>
          <button id="btn-redo" title="Rehacer" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-amber-300 active:scale-90">
            <i data-lucide="redo-2" class="w-5 h-5"></i>
          </button>
          <button id="btn-fit-view" title="Encuadrar" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-slate-100 active:scale-90">
            <i data-lucide="maximize" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Pisos, opciones de vista y aviso de mensura: apilados, dejando libre la columna de botones de la derecha -->
        <div class="absolute top-2 left-2 right-14 z-20 flex flex-col items-start gap-1.5 pointer-events-none">
        <div class="pointer-events-auto flex flex-wrap items-center gap-1.5 glass-panel rounded-xl p-1.5">
          <div class="flex items-center gap-1">
            <i data-lucide="layers" class="w-4 h-4 text-sky-400 mx-1"></i>
            <select id="level-select" class="bg-slate-800 border border-slate-600 rounded px-1.5 py-1 text-xs text-slate-100 max-w-[140px]"></select>
            <button id="btn-level-add" title="Agregar piso" class="w-7 h-7 rounded bg-emerald-600 text-white flex items-center justify-center active:scale-95"><i data-lucide="plus" class="w-4 h-4"></i></button>
            <button id="btn-level-rename" title="Renombrar piso" class="w-7 h-7 rounded bg-slate-800 text-slate-200 flex items-center justify-center active:scale-95"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
            <button id="btn-level-delete" title="Eliminar piso" class="w-7 h-7 rounded bg-slate-800 text-rose-300 flex items-center justify-center disabled:opacity-30 active:scale-95"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </div>
          <div class="h-4 w-px bg-slate-700 mx-0.5"></div>
          <!-- Conmutadores de cotas y m² -->
          <button id="btn-toggle-m2" title="Mostrar / Ocultar m² de ambientes" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-600 text-emerald-400 font-bold text-xs flex items-center gap-1">
            <i data-lucide="square" class="w-3.5 h-3.5"></i><span>m²</span>
          </button>
          <button id="btn-toggle-linear" title="Mostrar / Ocultar cotas lineales (m)" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-600 text-sky-400 font-bold text-xs flex items-center gap-1">
            <i data-lucide="ruler" class="w-3.5 h-3.5"></i><span>Cotas (m)</span>
          </button>
          <select id="select-theme" title="Estilo gráfico del plano" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-slate-200 font-medium">
            <option value="realestate">Inmobiliario Comercial</option>
            <option value="blackwhite">Arquitectónico (B&N)</option>
            <option value="blueprint">Técnico CAD (Blueprint)</option>
            <option value="warm">Cálido / Editorial</option>
          </select>
        </div>

        <div id="plan-loaded-banner" class="hidden pointer-events-auto glass-panel rounded-lg px-2.5 py-1.5 text-[11px] flex items-center gap-2">
          <i data-lucide="file-check" class="w-4 h-4 text-sky-400"></i>
          <span class="text-slate-200">Mensura: <b id="plan-status" class="text-amber-300"></b></span>
          <div class="h-3 w-px bg-slate-700"></div>
          <button id="btn-toggle-plan-vis" class="text-slate-300 hover:text-white p-0.5" title="Mostrar/Ocultar mensura de fondo"><i data-lucide="eye" class="w-3.5 h-3.5"></i></button>
          <input type="range" id="input-plan-opacity" min="0.1" max="1" step="0.05" value="0.65" class="w-16 accent-emerald-500 cursor-pointer" title="Opacidad de la mensura">
          <button id="btn-remove-plan-bg" class="text-slate-400 hover:text-rose-400" title="Quitar mensura"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        </div>

        <!-- Propiedades del elemento seleccionado -->
        <div id="sel-panel" class="hidden absolute bottom-2 left-2 right-2 glass-panel rounded-xl px-3 py-2 text-xs flex flex-wrap items-center gap-x-3 gap-y-2 z-20"></div>
      </div>

      <!-- Selector de objetos -->
      <div id="object-picker" class="hidden absolute inset-0 z-30 bg-black/60 flex items-end sm:items-center justify-center">
        <div class="w-full sm:max-w-lg max-h-[75%] bg-slate-900 border border-slate-700 rounded-t-2xl sm:rounded-2xl flex flex-col">
          <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
            <span class="text-sm font-bold text-white">Elegí un objeto</span>
            <button id="btn-close-picker" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div id="object-grid" class="scroll-y p-4"></div>
        </div>
      </div>
    </div>

    <!-- VISTA: MODELO 3D -->
    <div id="view-3d" class="absolute inset-0 bg-slate-200 hidden">
      <div id="three-container" class="w-full h-full"></div>

      <div class="absolute top-3 left-3 glass-panel rounded-xl p-3 text-xs font-mono space-y-2 z-20">
        <div class="flex items-center justify-between gap-4">
          <label id="label-level-height" class="text-slate-300 text-[11px]">Altura del piso (m)</label>
          <input type="number" id="input-wall-height" value="2.60" step="0.1" min="1" max="10" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-right font-bold text-emerald-400 text-xs">
        </div>
        <div class="flex items-center justify-between gap-4">
          <label class="text-slate-300 text-[11px]">Espesor muros (m)</label>
          <input type="number" id="input-wall-thickness" value="0.15" step="0.05" min="0.05" max="1.0" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-right font-bold text-sky-400 text-xs">
        </div>
        <div class="flex items-center justify-between gap-2 border-t border-slate-700 pt-2">
          <select id="select-levels-3d" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200">
            <option value="all">Todos los pisos</option>
            <option value="upto">Hasta el piso actual</option>
          </select>
          <select id="select-render-mode" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200">
            <option value="solid">Sólido</option>
            <option value="wireframe">Alambre</option>
          </select>
          <button id="btn-frame-3d" class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-slate-200">Encuadrar</button>
        </div>
      </div>

      <div class="absolute bottom-3 left-3 glass-panel px-3 py-2 rounded-xl text-xs font-mono text-slate-300 pointer-events-none">
        Pisos: <span id="hud-3d-levels" class="text-purple-400 font-bold">1</span> &middot;
        Muros: <span id="hud-3d-walls" class="text-sky-400 font-bold">0</span> &middot;
        Aberturas: <span id="hud-3d-openings" class="text-amber-400 font-bold">0</span> &middot;
        Objetos: <span id="hud-3d-objects" class="text-emerald-400 font-bold">0</span>
      </div>
    </div>
  </main>

  <!-- PANEL INFERIOR DE NAVEGACIÓN POR PESTAÑAS -->
  <nav class="h-16 bg-slate-900 border-t border-slate-800 grid grid-cols-2 z-30 flex-shrink-0">
    <button id="tab-cad" class="flex flex-col items-center justify-center gap-1 text-emerald-400 font-medium text-[11px]">
      <i data-lucide="drafting-compass" class="w-5 h-5"></i>
      <span>Plano 2D</span>
    </button>
    <button id="tab-3d" class="flex flex-col items-center justify-center gap-1 text-slate-400 font-medium text-[11px]">
      <i data-lucide="box" class="w-5 h-5"></i>
      <span>Modelo 3D</span>
    </button>
  </nav>

  <!-- Aplicación: modelo único + vistas que lo interpretan -->
  <script src="js/model.js"></script>
  <script src="js/library.js"></script>
  <script src="js/editor2d.js"></script>
  <script src="js/view3d.js"></script>
    <script src="js/detect.js"></script>
  <script src="js/exporters.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
